name: Build Installer

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean pyinstaller.spec
      
      - name: Install Inno Setup
        run: |
          choco install innosetup --yes
      
      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss
      
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GemmaSupportTool-Windows-Portable
          path: dist/GemmaSupportTool/
          retention-days: 30
      
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GemmaSupportTool-Windows-Installer
          path: dist/installer/*.exe
          retention-days: 30
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean pyinstaller.spec
      
      - name: Create archive
        run: |
          cd dist
          tar -czvf GemmaSupportTool-Linux.tar.gz GemmaSupportTool/
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: GemmaSupportTool-Linux
          path: dist/GemmaSupportTool-Linux.tar.gz
          retention-days: 30
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/GemmaSupportTool-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      
      - name: Build executable with PyInstaller
        run: |
          pyinstaller --clean pyinstaller.spec
      
      - name: Create archive
        run: |
          cd dist
          zip -r GemmaSupportTool-macOS.zip GemmaSupportTool/
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: GemmaSupportTool-macOS
          path: dist/GemmaSupportTool-macOS.zip
          retention-days: 30
      
      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: dist/GemmaSupportTool-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
